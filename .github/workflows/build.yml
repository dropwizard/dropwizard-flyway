---
name: Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - release/*
  pull_request:
jobs:
  yamllint:
    uses: dropwizard/workflows/.github/workflows/yamllint.yml@2a40bf0a6d89a800fae9d51157b6246bd4e1a9cd # main
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    uses: dropwizard/workflows/.github/workflows/maven.yml@2a40bf0a6d89a800fae9d51157b6246bd4e1a9cd # main
    secrets: inherit
    with:
      java-version: ${{ matrix.java-version }}
