---
name: Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - release/*
  pull_request:
jobs:
  yamllint:
    uses: dropwizard/workflows/.github/workflows/yamllint.yml@08d8cd1c39948aed33762fa94c77c42785f9019b # main
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    uses: dropwizard/workflows/.github/workflows/maven.yml@08d8cd1c39948aed33762fa94c77c42785f9019b # main
    secrets: inherit
    with:
      java-version: ${{ matrix.java-version }}
