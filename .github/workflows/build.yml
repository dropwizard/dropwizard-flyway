---
name: Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - release/*
  pull_request:
jobs:
  yamllint:
    uses: dropwizard/workflows/.github/workflows/yamllint.yml@fd38a7d9028b8d6c3f88360f017add78e7d5b5fd # main
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    uses: dropwizard/workflows/.github/workflows/maven.yml@fd38a7d9028b8d6c3f88360f017add78e7d5b5fd # main
    secrets: inherit
    with:
      java-version: ${{ matrix.java-version }}
