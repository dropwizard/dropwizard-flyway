---
name: Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - release/*
  pull_request:
jobs:
  yamllint:
    uses: dropwizard/workflows/.github/workflows/yamllint.yml@bf2e023abf49088f77953cac78fb30a7b0a64720 # main
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    uses: dropwizard/workflows/.github/workflows/maven.yml@bf2e023abf49088f77953cac78fb30a7b0a64720 # main
    secrets: inherit
    with:
      java-version: ${{ matrix.java-version }}
