---
# yamllint disable rule:comments rule:line-length
name: Trigger Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Version of the next release
        required: true
        type: string
      developmentVersion:
        description: Version of the next development cycle (must end in "-SNAPSHOT")
        required: true
        type: string
jobs:
  release:
    uses: dropwizard/workflows/.github/workflows/trigger-release.yml@2a40bf0a6d89a800fae9d51157b6246bd4e1a9cd # main
    secrets: inherit
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
      developmentVersion: ${{ inputs.developmentVersion }}
